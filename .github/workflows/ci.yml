name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      TEST_WEB_MODE: preview
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7
      # Playwright's disposable Go/SQLite stack uses node:sqlite.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run check
      - name: Build
        run: bun run build
      - name: Security audit
        run: bun audit --audit-level=high
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Browser integration tests
        run: bun run test:e2e --reporter=line,html
      - name: Upload browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Unit and HTTP integration tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...

  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements-ci.txt
            ai-service/requirements-dev.txt
            ai-service/requirements.lock
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Compile application
        run: python -m compileall -q app
      - name: Unit and API integration tests
        run: python -m pytest -q tests
